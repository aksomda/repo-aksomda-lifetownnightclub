name: repo_aksomda_lifetownnightclub
description: "Lifetown Maquis Management App — Flutter + API réelle."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  hive: ^2.2.3
  # hive_flutter fournit Hive.initFlutter(), utilisé par main.dart mais
  # absent du pubspec original -> l'app ne pouvait pas compiler.
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  # Provider : partage des controllers (Auth/Menu/Orders/Stock/Staff)
  # entre les écrans sans tout reconstruire dans main.dart.
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
